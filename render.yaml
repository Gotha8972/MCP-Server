services:
  - type: web
    name: splitwise-mcp
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: fastmcp run --transport sse --host 0.0.0.0 --port $PORT server.py
    envVars:
      - key: SPLITWISE_CONSUMER_KEY
        sync: false
      - key: SPLITWISE_CONSUMER_SECRET
        sync: false
      - key: SPLITWISE_API_KEY
        sync: false
