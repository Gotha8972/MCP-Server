services:
  - type: web
    name: splitwise-mcp
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    envVars:
      - key: SPLITWISE_CONSUMER_KEY
        sync: false
      - key: SPLITWISE_CONSUMER_SECRET
        sync: false
      - key: SPLITWISE_API_KEY
        sync: false
